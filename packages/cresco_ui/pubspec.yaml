name: cresco_ui
description: Design system Cresco (noir et citron vert) — docs/design/DESIGN.md.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

flutter:
  # Media generated with ChatGPT for the validated design (docs/design/medias/README.md).
  assets:
    - assets/body/
    - assets/coach/
    - assets/dishes/
    - assets/equipment/
    - assets/icons/
    - assets/photos/
  fonts:
    # Inter — SIL Open Font License (fonts/OFL-Inter.txt). Police variable : graisses 100 à 900.
    - family: Inter
      fonts:
        - asset: fonts/Inter[opsz,wght].ttf
    # Barlow Condensed — SIL Open Font License (fonts/OFL-BarlowCondensed.txt). Chiffres d’affiche.
    - family: BarlowCondensed
      fonts:
        - asset: fonts/BarlowCondensed-Bold.ttf
          weight: 700
        - asset: fonts/BarlowCondensed-ExtraBold.ttf
          weight: 800
    # Gelasio — SIL Open Font License (fonts/OFL-Gelasio.txt). Métriques compatibles Georgia.
    - family: Gelasio
      fonts:
        - asset: fonts/Gelasio[wght].ttf
        - asset: fonts/Gelasio-Italic[wght].ttf
          style: italic
    # Phosphor Icons — MIT (fonts/LICENSE-Phosphor.txt). Thin line icons of mockup G (CrescoIcons).
    - family: PhosphorRegular
      fonts:
        - asset: fonts/Phosphor-Regular.ttf
    - family: PhosphorBold
      fonts:
        - asset: fonts/Phosphor-Bold.ttf
